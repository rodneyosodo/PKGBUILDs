name: release-packages

# Packages that follow upstream's GitHub releases. Every three hours each one is checked against the latest release;
# a new release updates pkgver and the checksums, is committed to main and published to the AUR. Changing a package
# on main publishes it too.

on:
  push:
    branches: [main]
    paths:
      - yogurt-appimage/**
      - dusk/**
      - dusk-bin/**
      - clacks/**
      - clacks-bin/**
      - .github/scripts/**
      - .github/workflows/release-packages.yml
  pull_request:
    paths:
      - yogurt-appimage/**
      - dusk/**
      - dusk-bin/**
      - clacks/**
      - clacks-bin/**
      - .github/scripts/**
      - .github/workflows/release-packages.yml
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    concurrency: aur-${{ matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: yogurt-appimage
            upstream: FrigadeHQ/yogurt
          - pkg: dusk
            upstream: rodneyosodo/dusk
          - pkg: dusk-bin
            upstream: rodneyosodo/dusk
          - pkg: clacks
            upstream: rodneyosodo/clacks
          - pkg: clacks-bin
            upstream: rodneyosodo/clacks
    env:
      PKG: ${{ matrix.pkg }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - run: pacman -Syu --noconfirm --needed git openssh pacman-contrib jq
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0 # to find the last commit that changed the package
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint
        run: bash .github/scripts/makepkg.sh check "$PKG"

      - name: Update to the latest release
        id: update
        if: env.ON_MAIN == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bash .github/scripts/update-from-release.sh "$PKG" "${{ matrix.upstream }}")
          if [ -z "$version" ]; then
            exit 0
          fi
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PKG/PKGBUILD" "$PKG/.SRCINFO"
          git commit -m "upgpkg: $PKG $version-1" -m "https://github.com/${{ matrix.upstream }}/releases/tag/v$version"
          # The other packages may push at the same time.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((attempt * 5))
          done
          echo "updated=true" >>"$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not start workflows, so an update is published here rather than by a new run.
      - name: Publish to the AUR
        if: env.ON_MAIN == 'true' && (github.event_name == 'push' || steps.update.outputs.updated == 'true')
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL
          GIT_AUTHOR_NAME=$(git log -1 --format=%an -- "$PKG")
          GIT_AUTHOR_EMAIL=$(git log -1 --format=%ae -- "$PKG")
          bash .github/scripts/aur-push.sh "$PKG" \
            "$(git log -1 --format=%s -- "$PKG") (${{ github.server_url }}/${{ github.repository }}/commit/$(git log -1 --format=%H -- "$PKG"))"
